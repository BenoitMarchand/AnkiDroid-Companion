name: Release

on:
  push:
    tags:
      - '*'

env:
  # The name of the main module repository
  main_project_module: app

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set env
      run: |
        echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
        echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu' # See 'Supported distributions' for available options
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    # Create APK Debug
    - name: Build apk debug project (APK) - ${{ env.main_project_module }} module
      run: ./gradlew assembleDebug

    # actions/create-release and actions/upload-release-asset are archived: use the GitHub CLI instead.
    - name: Create release with the APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cp ${{ env.main_project_module }}/build/outputs/apk/debug/app-debug.apk "${{ env.repository_name }}-${{ env.RELEASE_VERSION }}.apk"
        gh release create "${{ env.RELEASE_VERSION }}" "${{ env.repository_name }}-${{ env.RELEASE_VERSION }}.apk" \
          --title "${{ env.RELEASE_VERSION }}" --generate-notes
