name: Release

# Started on request (Actions tab > Release > Run workflow, or `gh workflow run release.yml`):
# increases the 2nd digit of the version on develop, merges develop into main, tags vX.Y.0 and publishes
# the APK as a GitHub release. Nothing is tagged unless the device tests pass on an emulator.
on:
  workflow_dispatch:

env:
  # The name of the main module repository
  main_project_module: app

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  # A release is only tagged when the device tests (fake AnkiDroid, app/src/androidTest) pass on an emulator.
  device-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: develop

    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run the device tests on an emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: true
        script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.ankidroid.companion.AnkiDroidProbeTest

  release:
    needs: device-tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: develop
        fetch-depth: 0

    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu' # See 'Supported distributions' for available options
        java-version: '17'
        cache: 'gradle'

    - name: Increase the minor version
      id: version
      run: python3 scripts/version.py minor

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Build before pushing anything: a failing build leaves develop and main untouched.
    - name: Build with Gradle (lint and unit tests)
      run: ./gradlew build assembleDebug

    - name: Commit, merge into main and tag
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -am "Release $VERSION"
        git checkout main
        git merge --no-ff develop -m "Release $VERSION"
        git tag "v$VERSION"
        git push origin develop main "v$VERSION"

    - name: Publish the release with the APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        APK="AnkiDroid-Companion-v$VERSION.apk"
        cp ${{ env.main_project_module }}/build/outputs/apk/debug/app-debug.apk "$APK"
        gh release create "v$VERSION" "$APK" --title "v$VERSION" --generate-notes --target main
